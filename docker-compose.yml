services:
  bot:
    build: .
    container_name: mattermost-bot
    command: gunicorn --bind 0.0.0.0:5000 --workers 4 mattermost:app
    ports:
      - "${FLASK_PORT:-5000}:5000"
    environment:
      - SQL_TOKEN=${SQL_TOKEN}
      - ID_TOKEN=${ID_TOKEN}
      - PPPOE_TOKEN=${PPPOE_TOKEN}
      - FLASK_PORT=5000
      - OLLAMA_HOST=${OLLAMA_HOST}
      - MODEL_NAME=${MODEL_NAME}
      - MCP_SERVER_URL=http://mcp-server:8000/sse
    depends_on:
      - mcp-server
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mcp-server:
    build: .
    container_name: mcp-server
    command: python server.py
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - MCP_HOST=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
